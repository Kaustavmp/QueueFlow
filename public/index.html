<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QueueFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--panel:#fff;--ink:#0e2a3b;--mute:#5b7183;--line:#d3dde5;--teal:#0b7a75;--teal-d:#095f5b;--amber:#f2a900;--red:#b83227;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}button.pri:hover{background:var(--teal-d)}
button.dng{color:var(--red)}button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:100%;max-width:380px}
.card h1{font-size:30px;margin-bottom:4px}.card p{color:var(--mute);margin:0 0 18px}
.card label{display:block;font-weight:600;margin:12px 0 4px}
.card .pri{width:100%;margin-top:18px;padding:11px}
.link{background:none;border:0;color:var(--teal);padding:0;text-decoration:underline}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--ink);color:#d9e5ec;padding:22px 16px;display:flex;flex-direction:column;gap:14px}
aside h1{color:#fff;font-size:22px}
aside .qi{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#d9e5ec;padding:10px 12px}
aside .qi:hover{background:#17394d;border-color:#17394d}
aside .qi.on{background:#fff;color:var(--ink)}
aside .qi b{font-family:'Bricolage Grotesque';background:var(--amber);color:var(--ink);border-radius:20px;padding:0 9px;font-size:13px}
aside form{display:flex;gap:6px}aside input{background:#17394d;border-color:#17394d;color:#fff}
aside form button{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
aside .foot{margin-top:auto;font-size:13px;display:flex;justify-content:space-between;align-items:center}
aside .foot button{background:none;color:#d9e5ec;border-color:#2c5167;padding:5px 10px}
main{padding:26px 32px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:32px}.tabs button{border-radius:0}.tabs button:first-child{border-radius:8px 0 0 8px}.tabs button:last-child{border-radius:0 8px 8px 0}
.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:18px;margin-bottom:12px}
.add{display:flex;gap:8px;margin-bottom:16px}
/* ticket stubs */
.ticket{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;position:relative;padding:10px 12px 10px 0}
.ticket .stub{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;width:84px;text-align:center;border-right:2px dashed var(--line);padding:6px 0;color:var(--teal)}
.ticket .who{flex:1;min-width:0}.ticket .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .who small{color:var(--mute)}
.ticket.first{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.ticket .act{display:flex;gap:6px}.ticket .act button{padding:5px 10px}
.now{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px}
.now .num{font-size:64px;font-weight:800;color:var(--amber);line-height:1}
.now p{margin:6px 0 14px;color:#b9cbd8}
.now button{margin-right:6px}.now button.dng{background:transparent;color:#ffb4ac;border-color:#6b3a36}
.now .idle{color:#b9cbd8}
.hist{list-style:none;margin:0;padding:0;font-size:14px}.hist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;border-radius:20px;padding:0 8px;background:#dff1ef;color:var(--teal-d)}.tag.c{background:#f7dcd9;color:var(--red)}
.empty{color:var(--mute);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .num{font-size:30px;font-weight:700}.kpi span{color:var(--mute);font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
svg text{font:11px 'Instrument Sans';fill:var(--mute)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:9}
#toast.err{background:var(--red)}
.mob{display:none}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside .list{display:flex;gap:6px;flex-wrap:wrap}aside .foot{margin:0}main{padding:18px}.grid,.charts{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.ticket{transition:transform .15s}.ticket.flash{transform:scale(1.015)}}
</style></head><body>

<section id="auth"><div class="card">
  <h1>QueueFlow</h1><p id="auth-sub">Sign in to manage your queues.</p>
  <form id="auth-form">
  <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="6" required>
  <button class="pri" id="auth-btn" type="submit">Sign in</button>
  </form>
  <p style="margin:14px 0 0;text-align:center"><span id="auth-alt">New here?</span> <button class="link" id="auth-toggle">Create an account</button></p>
</div></section>

<div id="app" class="hide">
  <aside>
    <h1>QueueFlow</h1>
    <form id="newq"><input id="qn" placeholder="New queue name" aria-label="New queue name" maxlength="80"><button>Create</button></form>
    <div class="list" id="qlist"></div>
    <div class="foot"><span id="who"></span><button id="out">Sign out</button></div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title">Welcome</h2>
      <div class="tabs"><button id="t-q" class="on">Queue</button><button id="t-d">Dashboard</button></div>
    </div>
    <div id="v-q"></div><div id="v-d" class="hide"></div>
  </main>
</div>
<div id="toast" class="hide" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={token:localStorage.qf_token||'',email:localStorage.qf_email||'',queues:[],cur:null,view:'q',mode:'login'};
const pad=n=>'T-'+String(n).padStart(3,'0');
const dur=ms=>{const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m<60?`${m}m ${s%60}s`:`${Math.floor(m/60)}h ${m%60}m`};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='hide',2800)}
async function api(path,method='GET',body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&S.token){logout();throw new Error(d.error)}
  if(!r.ok)throw new Error(d.error||'Request failed');return d;
}
const run=async fn=>{try{await fn()}catch(e){toast(e.message,true)}};

// ---- auth
function setMode(m){S.mode=m;const l=m==='login';$('#auth-btn').textContent=l?'Sign in':'Create account';$('#auth-sub').textContent=l?'Sign in to manage your queues.':'Create a manager account.';$('#auth-alt').textContent=l?'New here?':'Already registered?';$('#auth-toggle').textContent=l?'Create an account':'Sign in';$('#pw').autocomplete=l?'current-password':'new-password'}
$('#auth-toggle').onclick=()=>setMode(S.mode==='login'?'register':'login');
async function submitAuth(){await run(async()=>{
  const d=await api('/auth/'+S.mode,'POST',{email:$('#em').value,password:$('#pw').value});
  S.token=d.token;S.email=d.email;localStorage.qf_token=d.token;localStorage.qf_email=d.email;$('#pw').value='';start();
})}
$('#auth-form').onsubmit=e=>{e.preventDefault();submitAuth()};
function logout(){S.token='';S.email='';localStorage.removeItem('qf_token');localStorage.removeItem('qf_email');$('#pw').value='';$('#app').classList.add('hide');$('#auth').classList.remove('hide')}
$('#out').onclick=logout;

// ---- queues
async function start(){
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=S.email;
  await loadQueues();
}
async function loadQueues(){await run(async()=>{
  S.queues=await api('/queues');
  if(!S.queues.find(q=>q.id===S.cur))S.cur=S.queues[0]?.id||null;
  $('#qlist').innerHTML=S.queues.map(q=>`<button class="qi ${q.id===S.cur?'on':''}" data-id="${q.id}"><span>${esc(q.name)}</span><b>${q.waiting}</b></button>`).join('')||'<p style="color:#8fa6b6;margin:0">No queues yet. Create your first one above.</p>';
  document.querySelectorAll('.qi').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.id;loadQueues()});
  render();
})}
$('#newq').onsubmit=e=>{e.preventDefault();run(async()=>{const q=await api('/queues','POST',{name:$('#qn').value});$('#qn').value='';S.cur=q.id;toast('Queue created');await loadQueues()})};
$('#t-q').onclick=()=>{S.view='q';render()};$('#t-d').onclick=()=>{S.view='d';render()};

async function render(){
  $('#t-q').className=S.view==='q'?'on':'';$('#t-d').className=S.view==='d'?'on':'';
  $('#v-q').classList.toggle('hide',S.view!=='q');$('#v-d').classList.toggle('hide',S.view!=='d');
  const q=S.queues.find(q=>q.id===S.cur);
  $('#title').textContent=q?q.name:(S.view==='d'?'All queues':'Welcome');
  if(S.view==='q')renderQueue(q);else renderDash();
}

async function renderQueue(q){
  const v=$('#v-q');
  if(!q){v.innerHTML='<div class="empty">Create a queue from the sidebar to start adding people.</div>';return}
  await run(async()=>{
    const d=await api('/queues/'+q.id);
    if(S.cur!==q.id||S.view!=='q')return;
    const sv=d.serving[0];
    const focus=document.activeElement?.id==='pn';const val=focus?$('#pn').value:'';
    v.innerHTML=`<div class="grid"><div class="panel">
      <h3>Waiting (${d.waiting.length})</h3>
      <form class="add" id="addf"><input id="pn" placeholder="Person's name" aria-label="Person's name" maxlength="80"><button class="pri">Add token</button></form>
      ${d.waiting.map((t,i)=>`<div class="ticket ${i?'':'first'}"><div class="stub">${pad(t.number)}</div>
        <div class="who"><b>${esc(t.name)}</b><small>Waiting ${dur(Date.now()-t.created_at)}${i?'':' · next up'}</small></div>
        <div class="act"><button data-mv="up" data-id="${t.id}" ${i?'':'disabled'} aria-label="Move up">&uarr;</button>
        <button data-mv="down" data-id="${t.id}" ${i<d.waiting.length-1?'':'disabled'} aria-label="Move down">&darr;</button>
        <button class="dng" data-cx="${t.id}">Cancel</button></div></div>`).join('')||'<div class="empty">Nobody is waiting. Add a name to issue the first token.</div>'}
    </div><div>
      <div class="now">${sv?`<small>Now serving</small><div class="num">${pad(sv.number)}</div><p>${esc(sv.name)} &middot; started ${dur(Date.now()-sv.started_at)} ago</p>
        <button class="pri" data-done="${sv.id}">Mark done</button><button class="dng" data-cx="${sv.id}">Cancel</button>`
        :`<small>Now serving</small><div class="num">&ndash;</div><p class="idle">No active token.</p>`}
        <div style="margin-top:${sv?14:0}px"><button class="pri" id="serve" ${d.waiting.length?'':'disabled'}>${sv?'Done &amp; call next':'Call next'}</button></div></div>
      <div class="panel" style="margin-top:18px"><h3>Recently closed</h3><ul class="hist">${d.recent.map(t=>`<li><span>${pad(t.number)} ${esc(t.name)}</span><span class="tag ${t.status==='cancelled'?'c':''}">${t.status}</span></li>`).join('')||'<li style="color:var(--mute)">Nothing yet.</li>'}</ul></div>
    </div></div>`;
    if(focus){$('#pn').value=val;$('#pn').focus()}
    $('#addf').onsubmit=e=>{e.preventDefault();act(`/queues/${q.id}/tokens`,{name:$('#pn').value},'Token added')};
    v.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>act(`/tokens/${b.dataset.id}/move`,{direction:b.dataset.mv}));
    v.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>confirm('Cancel this token?')&&act(`/tokens/${b.dataset.cx}/cancel`,{},'Token cancelled'));
    v.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>act(`/tokens/${b.dataset.done}/complete`,{},'Marked done'));
    $('#serve').onclick=()=>act(`/queues/${q.id}/serve`,{},'Token called');
  });
}
const act=(p,b,msg)=>run(async()=>{await api(p,'POST',b);if(msg)toast(msg);await loadQueues()});

// ---- dashboard
function lineChart(pts){
  if(pts.length<1)return '<div class="empty">Trend appears once people join the queue.</div>';
  const W=520,H=210,L=34,B=24,T=10,R=8,t0=pts[0].ts,t1=Math.max(Date.now(),pts.at(-1).ts),mx=Math.max(3,...pts.map(p=>p.length));
  const x=t=>L+(t-t0)/Math.max(1,t1-t0)*(W-L-R),y=v=>T+(1-v/mx)*(H-T-B);
  let d=`M${x(t0)},${y(pts[0].length)}`;pts.forEach((p,i)=>{if(i)d+=` H${x(p.ts)} V${y(p.length)}`});d+=` H${x(t1)}`;
  const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="#d3dde5"/><text x="${L-6}" y="${y(mx*f)+4}" text-anchor="end">${Math.round(mx*f)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Queue length over time">${grid}
    <path d="${d} V${y(0)} H${x(t0)}Z" fill="#0b7a75" opacity=".12"/><path d="${d}" fill="none" stroke="#0b7a75" stroke-width="2.5"/>
    <text x="${L}" y="${H-6}">${hm(t0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${hm(t1)}</text></svg>`;
}
function barChart(rows){
  if(!rows.length)return '<div class="empty">Call a token to see wait times.</div>';
  const W=520,H=210,L=34,B=24,T=10,R=8,mx=Math.max(1000,...rows.map(r=>r.wait)),bw=(W-L-R)/rows.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wait time per token">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#d3dde5"/><text x="${L-6}" y="${T+8}" text-anchor="end">${dur(mx)}</text>
    ${rows.map((r,i)=>{const h=r.wait/mx*(H-T-B);return `<rect x="${L+i*bw+bw*.15}" y="${H-B-h}" width="${bw*.7}" height="${h}" rx="3" fill="#f2a900"><title>${pad(r.number)} ${esc(r.name)}: ${dur(r.wait)}</title></rect>
    <text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${r.number}</text>`}).join('')}</svg>`;
}
async function renderDash(){
  const v=$('#v-d');
  await run(async()=>{
    const d=await api('/analytics'+(S.cur?'?queue_id='+S.cur:''));
    if(S.view!=='d')return;
    const k=(n,l)=>`<div class="kpi"><div class="num">${n}</div><span>${l}</span></div>`;
    v.innerHTML=`<div class="kpis">${k(d.totals.waiting,'Waiting now')}${k(d.totals.served,'Served')}${k(d.avgWait?dur(d.avgWait):'–','Average wait')}${k(d.avgService?dur(d.avgService):'–','Average service time')}</div>
    <div class="kpis">${k(d.maxWait?dur(d.maxWait):'–','Longest wait')}${k(d.peakLength,'Peak queue length (24h)')}${k(d.totals.cancelled,'Cancelled')}${k(d.totals.total,'Tokens issued')}</div>
    <div class="charts"><div class="panel"><h3>Queue length, last 24 hours</h3>${lineChart(d.trend)}</div>
    <div class="panel"><h3>Wait before service, latest tokens</h3>${barChart(d.recentWaits)}</div></div>`;
  });
}

setInterval(()=>{if(S.token&&!document.hidden&&document.activeElement?.tagName!=='INPUT'||(document.activeElement?.id==='pn'))S.token&&loadQueues()},6000);
setMode('login');if(S.token)start();
</script></body></html>
